<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펭귄으로 배우는 결정트리와 kNN</title>

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){

  }
}
:root[data-theme="dark"]{
  --bg:#0E1A24; --surface:#152331; --ink:#E4ECF2; --muted:#9BADBC; --line:#2A3C4C; --soft:#1C2E3E;
  --adelie:#F08A2A; --chin:#B774E8; --gentoo:#2BB3B3; --yes:#6FA8E0; --star:#F4F7FA; --good:#4CC38A; --bad:#EF6B5E;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:16px;line-height:1.65;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--yes);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
header.top h1{font-size:1.75rem;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
header.top p{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:12px}
.tabs button{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.stepper{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.stepper button{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:7px 12px 7px 8px;border-radius:999px;cursor:pointer;font-size:.9rem;color:var(--muted)}
.stepper button .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--soft);font-weight:700;font-size:.8rem}
.stepper button.on{border-color:var(--ink);color:var(--ink)}
.stepper button.on .n{background:var(--ink);color:var(--surface)}
.stepper button.done .n{background:var(--line);color:var(--ink)}
.stage{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:880px){.stage{grid-template-columns:1fr}}
.plotbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 6px;position:sticky;top:12px}
@media (max-width:880px){.plotbox{position:static}}
.plotbox svg{width:100%;height:auto;display:block;touch-action:manipulation}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted);padding:4px 8px 6px}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.plotbox .legend svg{flex-shrink:0;width:14px;height:14px;display:inline-block}
.hint{font-size:.82rem;color:var(--muted);padding:0 8px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px}

.panel h3{font-size:1rem;margin:18px 0 6px;font-weight:700}

.muted{color:var(--muted)}
.formula{background:var(--soft);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:1.02rem;overflow-x:auto;white-space:nowrap}
.formula.wrapok{white-space:normal}
table{border-collapse:collapse;width:100%;font-size:.88rem}
.tablewrap{overflow-x:auto;margin:8px 0}
.tablewrap.scroll{max-height:330px;overflow-y:auto}
.tablewrap.scroll thead th{position:sticky;top:0;background:var(--surface)}
th,td{padding:5px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500}

.sp{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--surface)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:10px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--yes)}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
@media (max-width:480px){.groups{grid-template-columns:1fr}}
.group{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.group .t{font-weight:700;font-size:.92rem;margin-bottom:4px}
.group.yes{border-color:color-mix(in srgb,var(--yes) 55%,var(--line))}
.counts{display:flex;flex-wrap:wrap;gap:8px;font-size:.88rem;margin-bottom:4px}
.big{font-size:1.2rem;font-weight:700}
.result{border-left:4px solid var(--ink);padding:8px 12px;margin:12px 0;background:var(--soft);border-radius:0 10px 10px 0}
.result.best{border-left-color:var(--good)}
.bars{display:grid;gap:6px;margin:8px 0}
.bar{display:grid;grid-template-columns:78px 1fr 28px;align-items:center;gap:8px;font-size:.88rem}
.bar .track{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar .fill{height:100%;border-radius:7px;transition:width .25s}
.nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:.92rem;cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--yes)}
.treebox svg{width:100%;height:auto;display:block}
ul.tight{margin:6px 0 10px;padding-left:20px}
ul.tight li{margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  const n=pts.length; const c=countOf(pts);
  const parts=ORDER.filter(k=>c[k]>0).map(k=>`(${c[k]}/${n})²`);

function candidates(pts,f){

  return out;
}
function evalSplit(pts,f,t){
  const Y=pts.filter(p=>p[f]<t), N=pts.filter(p=>p[f]>=t), n=pts.length;
  const gY=giniFrac(Y), gN=giniFrac(N);
  const wY=frac(Y.length*gY.n, n*gY.d), wN=frac(N.length*gN.n, n*gN.d);
  const w=fadd(wY,wN);
  return {f,t,Y,N,gY,gN,w,wv:w.n/w.d};
}
function allSplits(pts){
  const res=[]; ['L','D'].forEach(f=>candidates(pts,f).forEach(t=>res.push(evalSplit(pts,f,t))));
  return res.sort((a,b)=>a.wv-b.wv || (a.f<b.f?-1:1));
}

  if(p[SECOND.f]<SECOND.t) return {s:'G',path:['root','n2','leafG']};

}

function knn(train,q,k){
  const d=train.map(p=>({p,d:dist(p,q)})).sort((a,b)=>a.d-b.d);
  const top=d.slice(0,k); const votes={A:0,C:0,G:0}; top.forEach(x=>votes[x.p.s]++);
  const mx=Math.max(...Object.values(votes));
  const tied=ORDER.filter(s=>votes[s]===mx);
  let s=tied[0], tie=tied.length>1;
  if(tie){ s=top.find(x=>tied.includes(x.p.s)).p.s; }
  return {sorted:d, top, votes, s, tie};
}

/* ---------- kNN 단계 ---------- */
function knnTable(q,k,sorted,selId){
  const rows=(sorted?[...SAMPLE].sort((a,b)=>dist(a,q)-dist(b,q)):SAMPLE);
  const rank=[...SAMPLE].sort((a,b)=>dist(a,q)-dist(b,q)).map(p=>p.id);
  return `<div class="tablewrap"><table><thead><tr><th class="l">번호</th><th class="l">종</th><th>(Δ길이)²</th><th>(Δ깊이)²</th><th>거리</th>${k?'<th>순위</th>':''}</tr></thead><tbody>`+
   rows.map(p=>{const dl=(p.L-q.L)**2, dd=(p.D-q.D)**2; const r=rank.indexOf(p.id)+1;
     const cls=[k&&r<=k?'hl':'', k&&r>k?'dim':'', selId===p.id?'hl':'', 'click'].join(' ');
     return `<tr class="${cls}" data-id="${p.id}"><td class="l">${p.id}</td><td class="l">${spTag(p.s)}</td><td>${dec(dl,2)}</td><td>${dec(dd,2)}</td><td><b>${dec(Math.sqrt(dl+dd),2)}</b></td>${k?`<td>${r}</td>`:''}</tr>`}).join('')+`</tbody></table></div>`;
}
function votesHTML(res,k){
  return `<div class="bars">${ORDER.map(s=>`<div class="bar"><span>${spTag(s)}</span><div class="track"><div class="fill" style="width:${res.votes[s]/k*100}%;background:${SPC[s].color}"></div></div><b>${res.votes[s]}</b></div>`).join('')}</div>`;
}
let gridCache={key:'',grid:null};
function knnGrid(train,k){
  const key=(train===FULL?'F':'S')+k; if(gridCache.key===key) return gridCache.grid;
  const nx=84, ny=54, cells=[]; 
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
    const L=XD[0]+(i+.5)/nx*(XD[1]-XD[0]), D=YD[1]-(j+.5)/ny*(YD[1]-YD[0]);
    cells.push(knn(train,{L,D},k).s);
  }
  gridCache={key,grid:{cells,nx,ny}}; return gridCache.grid;
}

   <p>k가 너무 작으면 이웃 한두 마리에 휘둘리고, 너무 크면 개체 수가 많은 종으로 쏠립니다. 이렇게 사람이 미리 정하는 값을 <b>하이퍼파라미터</b>라고 해요.</p>
   <h3>2. 원이 왜 타원으로 보일까?</h3>
   <p>그래프에서 가장 가까운 k마리를 감싼 선은 거리가 같은 점들의 모임, 즉 원입니다. 그런데 부리 길이 축은 28mm, 부리 깊이 축은 9mm 폭이라 화면에서 늘어나 보여요. 반대로 말하면 <b>값의 범위가 넓은 특징(부리 길이)이 거리에 더 큰 영향</b>을 준다는 뜻입니다. 그래서 실제로는 특징의 크기를 맞추는 전처리(표준화)를 합니다.</p>
   <h3>3. 특징이 좋아야 거리도 의미가 있습니다</h3>
   <p>부리 길이와 깊이는 연구자가 자로 잰, 종을 구분하는 데 의미 있는 값이라 거리가 곧 "닮은 정도"가 됐어요. <b>만약 펭귄의 사진만 있다면</b> 무엇과 무엇의 거리를 재야 할까요?</p>`;
   panel.querySelectorAll('#tk button').forEach(b=>b.onclick=()=>{state.think.k=+b.dataset.k;KNN_STEPS[4].render()});
 }}
];

/* ---------- 화면 전환 ---------- */
function steps(){return state.page==='tree'?TREE_STEPS:KNN_STEPS}
function render(){
  const S=steps(), cur=state.step[state.page];
  document.getElementById('tab-tree').setAttribute('aria-selected',state.page==='tree');
  document.getElementById('tab-knn').setAttribute('aria-selected',state.page==='knn');
  const sp=document.getElementById('stepper');
  sp.innerHTML=S.map((s,i)=>`<button data-i="${i}" class="${i===cur?'on':''} ${i<cur?'done':''}" ${i===cur?'aria-current="step"':''}><span class="n">${i+1}</span>${s.title}</button>`).join('');
  sp.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.step[state.page]=+b.dataset.i;render()});
  S[cur].render();
  const on=sp.querySelector('.on'); if(on) sp.scrollLeft=on.offsetLeft-sp.clientWidth/2+on.clientWidth/2;
  document.getElementById('prev').disabled=cur===0 && state.page==='tree';
  const nx=document.getElementById('next');
  nx.textContent = cur===S.length-1 ? (state.page==='tree'?'kNN으로 넘어가기':'처음으로') : '다음 단계';
}
document.getElementById('prev').onclick=()=>{const c=state.step[state.page]; if(c>0){state.step[state.page]--;} else if(state.page==='knn'){state.page='tree';state.step.tree=TREE_STEPS.length-1} render(); window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('next').onclick=()=>{const S=steps(),c=state.step[state.page];
  if(c<S.length-1) state.step[state.page]++; else if(state.page==='tree'){state.page='knn';state.step.knn=0} else {state.page='tree';state.step.tree=0}
  render(); if(window.innerWidth<880) window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('tab-tree').onclick=()=>{state.page='tree';render()};
document.getElementById('tab-knn').onclick=()=>{state.page='knn';render()};
render();
</script>
